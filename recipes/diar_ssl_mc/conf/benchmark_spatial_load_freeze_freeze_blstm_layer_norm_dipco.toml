ckpt_dir = "/net/vol/ameise/Diarizen/exp/benchmark_spatial_freeze_blstm_layer_norm_ami/checkpoints/best/pytorch_model.bin"
# specify loading checkpoint with name which part should be loaded (see ckpt_utils.py)


[trainer]
path = "trainer_dual_opt.Trainer"
[trainer.args]
num_spk = false
#noisy_labels = false
max_epochs = 100
gradient_percentile = 90
gradient_history_size = 1000
save_max_score = false
save_ckpt_interval = 1
max_patience = 10
max_num_checkpoints = 100
gradient_accumulation_steps = 1
validation_interval = 1
freeze_wavlm = false
lr_decay = false
use_one_cycle_lr = false
validation_before_training = true       # activate validation activate validation activate validation activate validation
preheat_epochs = 0


[optimizer_small]
path = "torch.optim.Adam"
[optimizer_small.args]
lr = 0

[optimizer_big]
path = "torch.optim.Adam"
[optimizer_big.args]
lr = 1e-5 # 3e-5 1e-5 3e-6

[model]
# TODO: Optimizer wavlm trainierne oder nicht? setzen
#path = "diarizen.models.eend.model_spk_count_ref_beamformed.Model"
path = "diarizen.models.eend.model_benchmark_spatial.Model"
[model.args]
ffn = 1024
film_dim = 11
num_layer_aux = 5
max_num_spk = 4
sin_cos = true
#median = "max"
attention_in_aux = 216 # 2*513 + 0 0 für /4
model_path= "/net/vol/deegen/models/wavlm_base_plus" #"/scratch/hpc-prf-nt2/deegen/models/wavlm_base_plus"
wavlm_layer_num = 13
wavlm_feat_dim = 768
softmax_weight_norm = true

freeze=true

attention_in_downstream = 768 
attention_in = 256

ffn_hidden = 1024
num_head = 4
num_layer_downstream = 2 
num_layer_encoder = 4
dropout = 0.1
chunk_size = 8
use_posi = false
output_activate_function = false
max_speakers_per_chunk = 4
selected_channel = 0
hidden_size = 512
downstream_model = "blstm"
use_l_norm = true

[train_dataset]
path = "dataset_lazy.DiarizationLazy"
[train_dataset.args]
load_gcc_dir = "/mnt/scratch/tmp/qdeegen/AMI_AIS_ALI_NSF_CHiME7/data/gccs/standard_gcc/"  #
gcpsd = true
subset = "train"  # "train"  # "dev"
scp_file = "data_files/dipco/dev/wav.scp"
rttm_file = "data_files/dipco/dev/rttm"
uem_file = "data_files/dipco/dev/all.uem"
chunk_size = 8
chunk_shift = 6
sample_rate = 16000
channel_mode = "multichannel"
num_spk = true

[train_dataset.dataloader]
batch_size = 32
num_workers = 1
drop_last = true
pin_memory = true
prefetch_factor = 1

[validate_dataset]
path = "dataset_lazy.DiarizationLazy"
[validate_dataset.args]
load_gcc_dir = "/mnt/scratch/tmp/qdeegen/AMI_AIS_ALI_NSF_CHiME7/data/gccs/standard_gcc/"  #
gcpsd = true
subset = "dev"  # "train"  # "dev"
scp_file = "data_files/dipco/dev/wav.scp"
rttm_file = "data_files/dipco/dev/rttm"
uem_file = "data_files/dipco/dev/all.uem"
