[meta]
save_dir = "/net/vol/ameise/Diarizen/exp"
seed = 3407
gcpsd = false

[finetune]
finetune = false
avg_ckpt_num = 1
freeze_wavlm = true
#ckpt_dir = "/mnt/matylda3/ihan/project/diarization/huggingface_hub/diarizen-wavlm-base-s80-md/pytorch_model.bin"
#ckpt_dir = "/mnt/matylda5/qdeegen/deploy/forschung/DiariZen/recipes/diar_ssl_mc/exp/spk_count_linear_noisy_to_gcpsd_encoder_ffn_film_all_layers/checkpoints/best/pytorch_model.bin"
#ckpt_dir = "/scratch/hpc-prf-nt2/deegen/merlin/wavlm_pruned/diarizen-wavlm-base-s80-md/pytorch_model.bin"  # nocuta2
#load_wavlm_only = false
# specify loading checkpoint with name which part should be loaded (see ckpt_utils.py)
#load_der_encoder = "/mnt/matylda5/qdeegen/deploy/forschung/DiariZen/recipes/diar_gcc/exp/gcpsd_encoder/checkpoints/best/pytorch_model.bin"


[trainer]
path = "trainer_dual_opt.Trainer"
[trainer.args]
num_spk = false
#noisy_labels = false
max_epochs = 100
gradient_percentile = 90
gradient_history_size = 1000
save_max_score = false
save_ckpt_interval = 1
max_patience = 10
max_num_checkpoints = 100
gradient_accumulation_steps = 1
validation_interval = 1
freeze_wavlm = false
lr_decay = false
use_one_cycle_lr = false
validation_before_training = true       # activate validation activate validation activate validation activate validation
preheat_epochs = 0
only_waveforms = true


[optimizer_small]
path = "torch.optim.Adam"
[optimizer_small.args]
lr = 0

[optimizer_big]
path = "torch.optim.Adam"
[optimizer_big.args]
lr = 1e-4 # 1e-3 1e-4 1e-5

[model]
# TODO: Optimizer wavlm trainierne oder nicht? setzen
#path = "diarizen.models.eend.model_spk_count_ref_beamformed.Model"
path = "diarizen.models.eend.model_benchmark_reproduction.Model"
[model.args]
model_path= "/net/vol/deegen/models/wavlm_base_plus" #"/scratch/hpc-prf-nt2/deegen/models/wavlm_base_plus"
wavlm_layer_num = 13
wavlm_feat_dim = 768
softmax_weight_norm = true

attention_in_downstream = 768 
attention_in = 256

ffn_hidden = 1024
num_head = 4
num_layer = 2 
dropout = 0.1
chunk_size = 8
use_posi = false
output_activate_function = false
max_speakers_per_chunk = 4
selected_channel = 0
hidden_size = 512
downstream_model = "blstm"

[train_dataset]
path = "dataset_lazy.DiarizationLazy"
[train_dataset.args]
load_gcc_dir =  "base"  #
gcpsd = false
subset = "train"  # "train"  # "dev"
scp_file = "data/AMI_AIS_ALI_NSF_CHiME7/train/AMI/wav_bf.scp"
rttm_file = "data/AMI_AIS_ALI_NSF_CHiME7/train/AMI/rttm"
uem_file = "data/AMI_AIS_ALI_NSF_CHiME7/train/AMI/all.uem"
chunk_size = 8
chunk_shift = 6
sample_rate = 16000
channel_mode = "multichannel"
num_spk = true
beamformit = true
filter = "ami"

[train_dataset.dataloader]
batch_size = 32
num_workers = 2
drop_last = true
pin_memory = true
prefetch_factor = 1

[validate_dataset]
path = "dataset_lazy.DiarizationLazy"
[validate_dataset.args]
load_gcc_dir =  "base"  #
gcpsd = false
subset = "dev"  # "train"  # "dev"
scp_file = "data/AMI_AIS_ALI_NSF_CHiME7/dev/AMI/wav_bf.scp"
rttm_file = "data/AMI_AIS_ALI_NSF_CHiME7/dev/AMI/rttm"
uem_file = "data/AMI_AIS_ALI_NSF_CHiME7/dev/AMI/all.uem"
chunk_size = 8
chunk_shift = 8
sample_rate = 16000
channel_mode = "multichannel"
num_spk = true
beamformit = true
filter = "ami"

[validate_dataset.dataloader]
batch_size = 16
num_workers = 2
drop_last = true
pin_memory = true
prefetch_factor = 2
